[project]
name = "rommates"
version = "0.1.0"
description = "Private ROM library cleanup and device deployment manager"
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "httpx[http2]==0.28.1",
  "mcp==2.1.1",
  "Pillow==12.3.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
