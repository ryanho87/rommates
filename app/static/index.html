<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>ROMmates</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <img class="brand-mark" src="/static/rommates-icon.png" alt="" width="28" height="24">
          <span>ROMmates</span>
          <button class="sidebar-close-button" id="sidebar-close-button" type="button" aria-label="Close navigation">×</button>
        </div>
        <nav id="navigation">
          <a class="nav-item active" href="/" data-view="overview"><span>Overview</span></a>
          <a class="nav-item" href="/library" data-view="library">
            <span>Library</span><span class="nav-count" id="nav-games">0</span>
          </a>
          <a class="nav-item" href="/artwork" data-view="artwork"><span>Artwork</span></a>
          <a class="nav-item" href="/transfers" data-view="transfers"><span>Transfers</span></a>
          <a class="nav-item" href="/duplicates" data-view="duplicates">
            <span>Duplicates</span><span class="nav-count" id="nav-duplicates">0</span>
          </a>
          <a class="nav-item" href="/naming" data-view="naming"><span>Naming</span></a>
          <a class="nav-item" href="/devices" data-view="devices">
            <span>Devices</span><span class="nav-count" id="nav-devices">0</span>
          </a>
          <a class="nav-item" href="/saves" data-view="saves">
            <span>Saves</span><span class="nav-count" id="nav-saves">0</span>
          </a>
          <a class="nav-item" href="/jobs" data-view="jobs"><span>Jobs</span></a>
          <a class="nav-item" href="/notifications" data-view="notifications"><span>Notifications</span></a>
          <a class="nav-item" href="/account" data-view="account"><span>Account</span></a>
          <a class="nav-item" href="/users" data-view="users"><span>Users</span></a>
          <a class="nav-item" href="/trash" data-view="trash">
            <span>Trash</span><span class="nav-count" id="nav-trash">0</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="account-state hidden" id="account-state">
            <div class="account-identity"><strong id="account-name"></strong><span id="account-role"></span></div>
            <div class="account-actions">
              <button class="button secondary small" id="guided-tour-button">Tour</button>
              <button class="button secondary small" id="logout-button">Sign out</button>
            </div>
          </div>
          <div class="root-state">
            <span>Library root</span>
            <code id="library-root">/roms</code>
          </div>
          <button class="button secondary full" id="scan-button">Scan library</button>
        </div>
      </aside>
      <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>

      <main id="main-content" tabindex="-1">
        <header class="topbar">
          <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-label="Open navigation" aria-controls="navigation" aria-expanded="false">
            <span aria-hidden="true"></span>
          </button>
          <div class="topbar-copy">
            <h1 id="page-title">Overview</h1>
            <p id="page-subtitle">Collection health and recent activity.</p>
            <button class="mobile-session-link hidden" id="mobile-session-link" type="button">
              Signed in as <strong id="mobile-session-name"></strong>
            </button>
          </div>
          <div class="topbar-actions">
            <span class="job-pill hidden" id="job-pill" role="status"></span>
            <button class="button danger-subtle small hidden" id="stop-job-button">Stop job</button>
            <button class="topbar-icon-button hidden" id="header-tour-button" type="button" aria-label="Start guided tour" title="Start guided tour">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"></path>
                <path d="M9 3v15M15 6v15"></path>
              </svg>
            </button>
            <div class="inbox-shell hidden" id="inbox-shell">
              <button class="inbox-button" id="inbox-button" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="inbox-popover"><span aria-hidden="true">●</span><b class="hidden" id="inbox-count">0</b></button>
              <section class="inbox-popover hidden" id="inbox-popover" aria-label="Your notifications">
                <div class="inbox-head"><strong>Notifications</strong><button class="button secondary small" id="inbox-read-all" type="button">Mark all read</button></div>
                <div class="inbox-list" id="inbox-list"></div>
              </section>
            </div>
            <button class="header-account hidden" id="header-account" type="button" aria-label="Open your account">
              <span class="header-account-avatar" id="header-account-avatar" aria-hidden="true">R</span>
              <span class="header-account-copy"><strong id="header-account-name"></strong><small id="header-account-role"></small></span>
            </button>
            <button class="button secondary" id="refresh-button">Refresh</button>
          </div>
        </header>

        <section id="view"></section>
      </main>
    </div>

    <dialog id="confirm-dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="dialog-title">Confirm action</h2>
          <button class="icon-button" value="cancel" aria-label="Close">×</button>
        </div>
        <div id="dialog-content"></div>
        <div class="dialog-actions">
          <button class="button secondary hidden" id="dialog-alternate" value="alternate">Clear changes</button>
          <button class="button secondary" id="dialog-cancel" value="cancel">Cancel</button>
          <button class="button danger" id="dialog-confirm" value="confirm">Move to trash</button>
        </div>
      </form>
    </dialog>

    <dialog class="game-detail-dialog" id="game-detail-dialog" aria-labelledby="game-detail-title">
      <div class="game-detail-shell">
        <div class="dialog-head game-detail-head">
          <div>
            <span class="eyebrow" id="game-detail-platform">ROM details</span>
            <h2 id="game-detail-title">Game details</h2>
          </div>
          <button class="icon-button" id="game-detail-close" type="button" aria-label="Close game details">×</button>
        </div>
        <div class="game-detail-content" id="game-detail-content"></div>
      </div>
    </dialog>

    <dialog class="device-flow-dialog" id="device-flow-dialog" aria-labelledby="device-flow-title">
      <div class="device-flow-shell">
        <div class="dialog-head device-flow-head">
          <h2 id="device-flow-title">Device setup</h2>
          <button class="icon-button" id="device-flow-close" type="button" aria-label="Close device setup">×</button>
        </div>
        <div class="device-flow-content" id="device-flow-content"></div>
      </div>
    </dialog>

    <div class="tour-layer hidden" id="tour-layer" aria-hidden="true">
      <button class="tour-backdrop" id="tour-backdrop" type="button" aria-label="Close guided tour"></button>
      <aside class="tour-card" id="tour-card" role="dialog" aria-labelledby="tour-title" aria-describedby="tour-description">
        <div class="tour-progress"><span id="tour-step-label"></span><button class="icon-button" id="tour-close-button" type="button" aria-label="Close guided tour">×</button></div>
        <h2 id="tour-title"></h2>
        <p id="tour-description"></p>
        <div class="tour-actions">
          <button class="button secondary small" id="tour-back-button" type="button">Back</button>
          <button class="button secondary small" id="tour-skip-button" type="button">Skip tour</button>
          <button class="button small" id="tour-next-button" type="button">Next</button>
        </div>
      </aside>
    </div>
    <button class="tour-launcher hidden" id="tour-launcher" type="button"><span aria-hidden="true">✦</span> Getting started</button>

    <div class="toast-region" id="toasts" aria-live="polite" aria-atomic="true"></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
