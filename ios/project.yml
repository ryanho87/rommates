name: ROMmates
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.rommates.app
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      CODE_SIGN_ENTITLEMENTS: ROMmates/Resources/ROMmates-Debug.entitlements
    Release:
      CODE_SIGN_ENTITLEMENTS: ROMmates/Resources/ROMmates-Release.entitlements
targets:
  ROMmates:
    type: application
    platform: iOS
    sources:
      - ROMmates
    info:
      path: ROMmates/Resources/Info.plist
      properties:
        CFBundleDisplayName: ROMmates
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Unlock your saved ROMmates session.
    settings:
      base:
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    scheme:
      testTargets:
        - ROMmatesTests
  ROMmatesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ROMmatesTests
    dependencies:
      - target: ROMmates
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
