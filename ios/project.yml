name: ROMmates
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.rommates.app
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 10
    SWIFT_VERSION: 6.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2NKFMTXAX5
  configs:
    Debug:
      CODE_SIGN_ENTITLEMENTS: ROMmates/Resources/ROMmates-Debug.entitlements
    Release:
      CODE_SIGN_ENTITLEMENTS: ROMmates/Resources/ROMmates-Release.entitlements
targets:
  ROMmates:
    type: application
    platform: iOS
    sources:
      - ROMmates
    info:
      path: ROMmates/Resources/Info.plist
      properties:
        CFBundleDisplayName: ROMmates
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Unlock your saved ROMmates session.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
schemes:
  ROMmates:
    build:
      targets:
        ROMmates: all
    run:
      config: Debug
    archive:
      config: Release
