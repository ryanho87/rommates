name: rommates

services:
  rommates:
    build: .
    image: rommates:latest
    container_name: rommates
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${ROMMATES_BIND:-${ROM_MANAGER_BIND:-0.0.0.0}}:${ROMMATES_PORT:-${ROM_MANAGER_PORT:-8080}}:8080"
    environment:
      ROMMATES_LIBRARY_ROOT: /emulation/roms
      ROMMATES_DEVICES_ROOT: /emulation/devices
      ROMMATES_TRASH_ROOT: /emulation/.rommates-trash
      ROMMATES_DATABASE_PATH: /data/rommates.db
      ROMMATES_SAVES_ROOT: /saves
      ROMMATES_SNAPSHOTS_ROOT: /data/save-snapshots
      ROMMATES_SAVE_SNAPSHOT_INTERVAL_MINUTES: "${ROMMATES_SAVE_SNAPSHOT_INTERVAL_MINUTES:-360}"
      ROMMATES_SAVE_RETENTION_RECENT: "${ROMMATES_SAVE_RETENTION_RECENT:-24}"
      ROMMATES_SAVE_RETENTION_DAILY: "${ROMMATES_SAVE_RETENTION_DAILY:-30}"
      ROMMATES_SAVE_RETENTION_WEEKLY: "${ROMMATES_SAVE_RETENTION_WEEKLY:-12}"
      ROMMATES_SAVE_RETENTION_MONTHLY: "${ROMMATES_SAVE_RETENTION_MONTHLY:-12}"
      ROMMATES_SCAN_ON_START: "true"
      ROMMATES_REQUIRE_EXISTING_ROOTS: "true"
      ROMMATES_ACCESS_TOKEN: "${ROMMATES_ACCESS_TOKEN:-${ROM_ACCESS_TOKEN:-}}"
      ROMMATES_ALLOW_ANONYMOUS: "${ROMMATES_ALLOW_ANONYMOUS:-${ROM_ALLOW_ANONYMOUS:-false}}"
      ROMMATES_SCAN_PRUNE_LIMIT: "${ROMMATES_SCAN_PRUNE_LIMIT:-${ROM_SCAN_PRUNE_LIMIT:-0.5}}"
      ROMMATES_FOLDER_BUNDLE_PLATFORMS: "${ROMMATES_FOLDER_BUNDLE_PLATFORMS:-ps3}"
    volumes:
      - "${ROMMATES_DATA_ROOT:-./data}:/data"
      - "${EMULATION_ROOT:?Set EMULATION_ROOT in .env}:/emulation"
      - "${RETROARCH_CLOUD_ROOT:-./data/retroarch-saves}:/saves"
    security_opt:
      - no-new-privileges:true
