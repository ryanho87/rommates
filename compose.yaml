name: rommates

services:
  rommates:
    build: .
    image: rommates:latest
    container_name: rommates
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${ROMMATES_BIND:-${ROM_MANAGER_BIND:-0.0.0.0}}:${ROMMATES_PORT:-${ROM_MANAGER_PORT:-8080}}:8080"
    environment:
      ROMMATES_LIBRARY_ROOT: /emulation/roms
      ROMMATES_DEVICES_ROOT: /emulation/devices
      ROMMATES_TRASH_ROOT: /emulation/.rommates-trash
      ROMMATES_DATABASE_PATH: /data/rommates.db
      ROMMATES_SCAN_ON_START: "true"
      ROMMATES_REQUIRE_EXISTING_ROOTS: "true"
      ROMMATES_ACCESS_TOKEN: "${ROMMATES_ACCESS_TOKEN:-${ROM_ACCESS_TOKEN:-}}"
      ROMMATES_ALLOW_ANONYMOUS: "${ROMMATES_ALLOW_ANONYMOUS:-${ROM_ALLOW_ANONYMOUS:-false}}"
      ROMMATES_SCAN_PRUNE_LIMIT: "${ROMMATES_SCAN_PRUNE_LIMIT:-${ROM_SCAN_PRUNE_LIMIT:-0.5}}"
    volumes:
      - ./data:/data
      - "${EMULATION_ROOT:?Set EMULATION_ROOT in .env}:/emulation"
    security_opt:
      - no-new-privileges:true
